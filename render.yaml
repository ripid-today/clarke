services:
  - type: web
    name: co-telegram-bot
    env: python
    region: singapore
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m bot.main
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: PORT
        value: 10000
    disk:
      name: agent-memory
      mountPath: /opt/render/project/src/.claude/agent-memory
      sizeGB: 1
    # IMPORTANT: Set WEBHOOK_URL env var to enable webhook mode
    # Format: https://your-service.onrender.com
    # If WEBHOOK_URL is not set, bot uses polling mode
