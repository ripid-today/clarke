name: Daily News Ingest

on:
  schedule:
    # 02:00 UTC = 09:00 GMT+7
    - cron: "0 2 * * *"
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  ingest:
    name: Fetch and ingest daily news
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Run news ingest script
        working-directory: website
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LIBRARY_API_KEY: ${{ secrets.LIBRARY_API_KEY }}
          DAILY_NEWS_INGEST_URL: ${{ secrets.DAILY_NEWS_INGEST_URL }}
          DAILY_NEWS_FOLDER_ID: ${{ secrets.DAILY_NEWS_FOLDER_ID }}
        run: npx tsx scripts/ingest-daily-news.ts
